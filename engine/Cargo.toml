[package]
name = "artcraft-engine"
version = "1.0.0"
edition = "2021"
authors = ["ArtCraft Team"]
description = "ArtCraft 2D Creative Engine compiled to WebAssembly for Nextcloud"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = { version = "0.1", optional = true }

[dependencies.web-sys]
version = "0.3"
features = [
  "CanvasRenderingContext2d",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "HtmlImageElement",
  "ImageData",
  "MouseEvent",
  "TouchEvent",
  "PointerEvent",
  "Window",
  "console",
  "Performance",
  "Blob",
  "Url"
]

[features]
default = ["console_error_panic_hook"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
